<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Renotion</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #37352f;
      --text-secondary: #787774;
      --border: #e9e9e7;
      --card-bg: #f7f7f5;
      --button-bg: #2eaadc;
      --button-hover: #2898c5;
      --button-text: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --text: #ffffff;
        --text-secondary: #9b9a97;
        --border: #2f2f2f;
        --card-bg: #202020;
        --button-bg: #2383e2;
        --button-hover: #1d72c6;
        --button-text: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--text-secondary);
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #eb5757;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button.btn-primary {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.btn-primary:hover {
      background-color: var(--button-hover);
    }

    button.btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button.btn-secondary:hover {
      background-color: var(--card-bg);
    }

    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>No internet connection</h1>
    <p>Renotion cannot reach Notion right now. Previously cached pages will be available once connected, or you can retry now.</p>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Disconnected · Auto-reconnecting...</span>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="retry-btn">
        <span>Try Again</span>
      </button>
      <button class="btn-secondary" id="cached-btn">
        <span>Open Notion Home</span>
      </button>
    </div>

    <div class="hint">
      Renotion will automatically resume when your connection returns.
    </div>
  </div>

  <script>
    const targetUrl = new URLSearchParams(window.location.search).get('target') || 'https://app.notion.com/';
    const retryBtn = document.getElementById('retry-btn');
    const cachedBtn = document.getElementById('cached-btn');
    const statusText = document.getElementById('status-text');

    function checkConnectionAndReload() {
      statusText.textContent = 'Checking connection...';
      fetch('https://app.notion.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          statusText.textContent = 'Connected! Loading...';
          window.location.href = targetUrl;
        })
        .catch(() => {
          statusText.textContent = 'Still offline · Retrying automatically...';
        });
    }

    retryBtn.addEventListener('click', checkConnectionAndReload);
    cachedBtn.addEventListener('click', () => {
      window.location.href = 'https://app.notion.com/';
    });

    window.addEventListener('online', checkConnectionAndReload);
    setInterval(checkConnectionAndReload, 6000);
  </script>
</body>
</html>
